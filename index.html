<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas - Profesor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!--
        Archivo: index.html
        Descripción: Interfaz principal del Gestor de Tareas.
        Contiene el formulario para crear/editar tareas, filtros de búsqueda,
        contadores y la tabla donde se muestran las tareas.
    -->

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">
                <i class="bi bi-journal-bookmark-fill"></i>
                Gestor de Tareas
            </h1>

            <p class="text-secondary">
                Panel para asignar tareas a los estudiantes
            </p>
        </div>

        <!-- Tarjeta principal: formulario para asignar nueva tarea -->
        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    <i class="bi bi-plus-circle"></i>
                    Asignar Nueva Tarea
                </h4>

            </div>

            <div class="card-body">

                <!-- Formulario para crear/editar una tarea -->
                <form id="formTarea">

                    <input type="hidden" id="idTarea">

                    <!-- Fila: Estudiante + Materia -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Estudiante
                            </label>

                            <input
                                type="text"
                                id="estudiante"
                                class="form-control"
                                placeholder="Nombre del estudiante"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Materia
                            </label>

                            <input
                                type="text"
                                id="materia"
                                class="form-control"
                                placeholder="Ej: Matemáticas"
                                required>

                        </div>

                    </div>

                    <!-- Campo: Título de la tarea -->
                    <div class="mb-3">

                        <label class="form-label">
                            Título de la tarea
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            class="form-control"
                            placeholder="Título"
                            required>

                    </div>

                    <!-- Campo: Descripción de la tarea -->
                    <div class="mb-3">

                        <label class="form-label">
                            Descripción
                        </label>

                        <textarea
                            id="descripcion"
                            rows="3"
                            class="form-control"
                            placeholder="Descripción de la actividad"
                            required></textarea>

                    </div>

                    <!-- Fila: Fecha de entrega + Botón de guardar -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Fecha de entrega
                            </label>

                            <input
                                type="date"
                                id="fecha"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 d-flex align-items-end">

                            <button
                                class="btn btn-primary w-100"
                                type="submit">

                                <i class="bi bi-send-fill"></i>
                                Guardar Tarea

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

        <!-- Barra de herramientas: búsqueda y filtro por estado -->
        <div class="row mt-4">

            <div class="col-md-6">

                <input
                    type="text"
                    id="buscar"
                    class="form-control"
                    placeholder="Buscar estudiante...">

            </div>

            <div class="col-md-6">

                <select
                    id="filtroEstado"
                    class="form-select">

                    <option value="todas">
                        Todas
                    </option>

                    <option value="pendientes">
                        Pendientes
                    </option>

                    <option value="completadas">
                        Completadas
                    </option>

                </select>

            </div>

        </div>

        <!-- Contadores: total, pendientes, completadas -->
        <div class="row text-center mt-4">

            <div class="col-md-4">

                <div class="card contador">

                    <div class="card-body">

                        <h3 id="totalTareas">
                            0
                        </h3>

                        <p>Total</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card contador">

                    <div class="card-body">

                        <h3 id="pendientes">
                            0
                        </h3>

                        <p>Pendientes</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card contador">

                    <div class="card-body">

                        <h3 id="completadas">
                            0
                        </h3>

                        <p>Completadas</p>

                    </div>

                </div>

            </div>

        </div>

        <!-- Lista de tareas: tabla con las tareas almacenadas -->
        <div class="card mt-4 shadow">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">
                    Lista de Tareas
                </h4>

            </div>

            <!-- Tabla responsiva para mostrar las tareas -->
            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-primary">

                        <tr>

                            <th>Estudiante</th>

                            <th>Materia</th>

                            <th>Título</th>

                            <th>Descripción</th>

                            <th>Entrega</th>

                            <th>Estado</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaTareas">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Scripts: Bootstrap + lógica de la aplicación -->
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
